<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Ivan Lanzoni — portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e12"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ff6a3d" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f3efe6" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95
                             0 0 0 0 0.93
                             0 0 0 0 0.90
                             0 0 0 0.18 0"/>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#rim)"/>

  <!-- silhouette: head + shoulders -->
  <g fill="url(#silhouette)">
    <path d="M 300 130
             c 70 0 110 50 110 110
             c 0 30 -10 55 -22 75
             c 25 8 40 25 50 50
             c 30 60 50 130 60 200
             l -396 0
             c 10 -70 30 -140 60 -200
             c 10 -25 25 -42 50 -50
             c -12 -20 -22 -45 -22 -75
             c 0 -60 40 -110 110 -110 z"/>
  </g>

  <!-- thin frame -->
  <rect x="14" y="14" width="572" height="722" fill="none" stroke="rgba(243,239,230,0.16)" stroke-width="1"/>
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="rgba(243,239,230,0.08)" stroke-width="0.5"/>

  <!-- title plate -->
  <g font-family="'JetBrains Mono', monospace" fill="#a8a59c" letter-spacing="3">
    <text x="40" y="56" font-size="11">— PORTRAIT · PLACEHOLDER</text>
    <text x="40" y="700" font-size="11">SOSTITUISCI · assets/about/portrait.jpg</text>
    <text x="40" y="720" font-size="11" fill="#6b6963">600 × 750 · jpg/webp</text>
  </g>

  <!-- big italic name -->
  <text x="300" y="690" font-family="Instrument Serif, serif" font-style="italic" font-size="48" fill="#f3efe6" text-anchor="middle">Ivan Lanzoni</text>

  <!-- film grain overlay -->
  <rect width="600" height="750" filter="url(#grain)" opacity="0.5"/>
</svg>
